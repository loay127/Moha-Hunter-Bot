name: ULP Storm & Bot 24/7
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Libs
        run: pip install telethon pyTelegramBotAPI

      - name: Run Monster
        run: |
          python bot.py &
          python main.py
