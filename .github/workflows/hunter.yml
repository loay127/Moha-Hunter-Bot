name: ULP Storm & Bot 24/7
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install telethon pyTelegramBotAPI
      - name: Launch Systems
        run: |
          # تشغيل البوت في الخلفية أولاً
          python bot.py &
          sleep 10
          # تشغيل السكربت الأساسي
          python main.py
