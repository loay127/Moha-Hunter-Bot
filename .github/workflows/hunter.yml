name: ULP Storm & Bot Separation
on:
  workflow_dispatch:

jobs:
  Telegram-Bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Bot Libs
        run: pip install pyTelegramBotAPI
      - name: Launch Bot
        run: python bot.py

  ULP-Scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Scraper Libs
        run: pip install telethon
      - name: Launch Scraper
        run: python main.py
