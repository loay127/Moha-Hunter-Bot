name: ULP Monster Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Everything
        run: |
          pip install telethon pyTelegramBotAPI
      - name: Run Bot and Scraper
        run: |
          python bot.py &
          sleep 10
          python main.py
