name: ULP_HUNTER_RUN

on:
  workflow_dispatch: # يخليك تشغله بيدك وقت ما تحب

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pyTelegramBotAPI

      - name: Run Hunter Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # السطر المهم اللي كان ناقصك يا لؤي راهو هنا لتحت
          STRING_SESSION: ${{ secrets.STRING_SESSION }} 
        run: python main.py
