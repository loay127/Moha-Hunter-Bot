name: ULP_HUNTER_RUN

on:
  workflow_dispatch: # يخليك تشغله بيدك وقت ما تحب

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3 # يجيب ملفاتك من المستودع

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # النسخة المستقرة اللي خدمنا بيها

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pyTelegramBotAPI # تثبيت المكتبات اللي يحتاجها البوت والصياد

      - name: Run Hunter Bot
        env:
          # إذا كنت مستعمل Secrets في GitHub حطهم هنا، وإذا لا، الكود راح يقرأهم من main.py مباشرة
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py # تشغيل الماكينة
